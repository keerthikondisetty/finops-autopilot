[project]
name = "finops"
version = "0.4.0"
description = "Spend anomaly detection and rightsizing recommendations for Kubernetes and AWS."
requires-python = ">=3.11"
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.6", "moto[s3,athena]>=5.0", "boto3-stubs[essential]>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=finops --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
